name: PAC checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pac-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bi_owner
          POSTGRES_PASSWORD: ci_only_admin_password
          POSTGRES_DB: bi_sintetico
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bi_owner -d bi_sintetico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Disposable synthetic database only; these are not production credentials.
    env:
      ADMIN_DATABASE_URL: postgresql://bi_owner:ci_only_admin_password@127.0.0.1:5432/bi_sintetico
      DATABASE_URL: postgresql://readonly_agent:ci_only_reader_password@127.0.0.1:5432/bi_sintetico
      TEST_DATABASE_URL: postgresql://readonly_agent:ci_only_reader_password@127.0.0.1:5432/bi_sintetico
      READONLY_PASSWORD: ci_only_reader_password
      GEMINI_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Lint
        run: python -m ruff check app scripts tests evaluation
      - name: Prepare isolated synthetic database
        run: |
          python -m scripts.manage_db init
          python -m scripts.manage_db seed --seed 42 --clients 30
          python -m scripts.manage_db validate
      - name: Unit and PostgreSQL integration tests
        run: python -m pytest -q --strict-markers
